<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Garage LK - Pro Suite</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding-bottom: 85px;
      min-height: 100vh;
    }

    /* Header */
    header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 14, 20, 0.8);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pwa-reload-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s ease;
    }

    .pwa-reload-btn:active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    /* Layout & Tabs */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards UI */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-cyan);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 20, 31, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(59, 130, 246, 0.3);
      transition: 0.2s ease;
      margin-top: 6px;
    }

    button.btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* Output Results */
    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0, 242, 254, 0.04);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 14px;
      text-align: center;
    }

    .result-val {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--accent-cyan);
      margin: 4px 0;
    }

    .result-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* News Cards (With Top Photo Banner) */
    .news-card {
      background: rgba(15, 20, 31, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .news-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.03);
    }

    .news-content {
      padding: 16px;
    }

    .news-source {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .news-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .news-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .news-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-cyan);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .news-link:active {
      background: rgba(59, 130, 246, 0.3);
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      border: none;
      background: none;
      width: 50%;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 1.25rem;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    /* Loading Spinner */
    .loader {
      border: 3px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      border-top: 3px solid var(--accent-cyan);
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 30px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-gear"></i> RC GARAGE LK
    </div>
    <button class="pwa-reload-btn" onclick="forceAppUpdate()">
      <i class="fa-solid fa-rotate"></i> Refresh App
    </button>
  </header>

  <div class="container">

    <!-- TAB 1: TOOLS (MECHANICAL GARAGE) -->
    <div id="tools-tab" class="tab-content active">
      
      <!-- 1. Battery Runtime Calculator (Simple mAh based) -->
      <div class="glass-card">
        <div class="card-title">
          <i class="fa-solid fa-battery-charging-full"></i> Battery Runtime Tester
        </div>

        <div class="form-group">
          <label>Battery Capacity (mAh)</label>
          <input type="number" id="bat-mah" placeholder="e.g. 1500, 2200, 5000" value="2200">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Battery Type</label>
            <select id="bat-chem">
              <option value="lipo">LiPo (3.7V)</option>
              <option value="liion">Li-Ion (3.6V)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cell Count</label>
            <select id="bat-cells">
              <option value="2" selected>2S (7.4V)</option>
              <option value="3">3S (11.1V)</option>
            </select>
          </div>
        </div>

        <button class="btn-primary" onclick="calculateRuntime()">Calculate Runtime</button>

        <div class="result-box" id="runtime-result" style="display:none;">
          <div class="result-sub">Estimated Real-World Runtime (80% DOD Safe Limit)</div>
          <div class="result-val" id="runtime-val">0 Mins</div>
          <div class="result-sub" id="runtime-sub-info">---</div>
        </div>
      </div>

      <!-- 2. Speed Calculator (Brushed Motor Size) -->
      <div class="glass-card">
        <div class="card-title">
          <i class="fa-solid fa-gauge-high"></i> Speed Calculator
        </div>

        <div class="form-group">
          <label>Brushed Motor Size</label>
          <select id="motor-size">
            <option value="260">260 Motor (~12,000 RPM)</option>
            <option value="280">280 Motor (~14,000 RPM)</option>
            <option value="370" selected>370 Motor (~16,500 RPM)</option>
            <option value="390">390 Motor (~19,000 RPM)</option>
            <option value="540">540 Motor (~20,000 RPM)</option>
            <option value="550">550 Motor (~22,500 RPM)</option>
          </select>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Battery Setup</label>
            <select id="speed-battery">
              <option value="2s-lipo">2S LiPo (7.4V)</option>
              <option value="3s-lipo">3S LiPo (11.1V)</option>
              <option value="2s-liion">2S Li-Ion (7.2V)</option>
              <option value="3s-liion">3S Li-Ion (10.8V)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tyre Diameter (mm)</label>
            <input type="number" id="tyre-dia" placeholder="e.g. 70, 110" value="75">
          </div>
        </div>

        <button class="btn-primary" onclick="calculateSpeed()">Calculate Actual Speed</button>

        <div class="result-box" id="speed-result" style="display:none;">
          <div class="result-sub">Estimated Top Speed</div>
          <div class="result-val" id="speed-val">0 km/h</div>
          <div class="result-sub" id="speed-sub-info">---</div>
        </div>
      </div>

    </div>

    <!-- TAB 2: LIVE RC NEWS -->
    <div id="news-tab" class="tab-content">
      <div class="glass-card">
        <div class="card-title">
          <i class="fa-solid fa-newspaper"></i> Live RC News Feed
        </div>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;">
          Instant updates from <strong>BigSquidRC</strong> & <strong>RedRC</strong>
        </p>

        <div id="news-container">
          <div class="loader"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tools-tab', this)">
      <i class="fa-solid fa-toolbox"></i>
      <span>Garage Tools</span>
    </button>
    <button class="nav-item" onclick="switchTab('news-tab', this)">
      <i class="fa-solid fa-newspaper"></i>
      <span>RC News</span>
    </button>
  </nav>

  <script>
    // Tab Switching Logic
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if(tabId === 'news-tab' && !window.newsLoaded) {
        fetchRCNews();
      }
    }

    // 1. Runtime Calculation using Battery mAh only
    function calculateRuntime() {
      const mah = parseFloat(document.getElementById('bat-mah').value);
      const chem = document.getElementById('bat-chem').value;
      const cells = parseInt(document.getElementById('bat-cells').value);

      if(!mah || mah <= 0) return alert('Please enter valid mAh');

      // 80% usable capacity calculation for battery safety
      const usableMah = mah * 0.8;
      
      // Estimated load draw curve based on chemistry
      const estAmpDraw = chem === 'lipo' ? 8.5 : 7.0; 
      const totalMinutes = Math.round((usableMah / (estAmpDraw * 1000)) * 60);

      const hrs = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;

      let displayText = hrs > 0 ? `${hrs}h ${mins}m` : `${mins} Mins`;
      const nominalVolt = (chem === 'lipo' ? 3.7 : 3.6) * cells;

      document.getElementById('runtime-result').style.display = 'block';
      document.getElementById('runtime-val').innerText = displayText;
      document.getElementById('runtime-sub-info').innerText = 
        `Pack Voltage: ${nominalVolt.toFixed(1)}V | Safe Capacity Limit: ${usableMah} mAh`;
    }

    // 2. Speed Calculation using Brushed Motor Sizes
    function calculateSpeed() {
      const motorSize = document.getElementById('motor-size').value;
      const batSetup = document.getElementById('speed-battery').value;
      const tyreMm = parseFloat(document.getElementById('tyre-dia').value);

      if(!tyreMm || tyreMm <= 0) return alert('Please enter Tyre Diameter in mm');

      // Base Motor RPMs @ standard 7.4V
      const motorRpmMap = {
        '260': 12000,
        '280': 14000,
        '370': 16500,
        '390': 19000,
        '540': 20000,
        '550': 22500
      };

      // Voltage Multipliers
      let voltMultiplier = 1.0;
      if(batSetup === '3s-lipo') voltMultiplier = 1.5;
      if(batSetup === '2s-liion') voltMultiplier = 0.97;
      if(batSetup === '3s-liion') voltMultiplier = 1.45;

      const estimatedRpm = motorRpmMap[motorSize] * voltMultiplier;
      
      // Internal scale reduction ratio average (~10:1)
      const gearReduction = 10.5;
      const wheelRpm = estimatedRpm / gearReduction;

      // Speed Math
      const circumferenceMeters = (Math.PI * tyreMm) / 1000;
      const speedMpm = wheelRpm * circumferenceMeters;
      const speedKmh = (speedMpm * 60) / 1000;
      const speedMph = speedKmh * 0.621371;

      document.getElementById('speed-result').style.display = 'block';
      document.getElementById('speed-val').innerText = `${speedKmh.toFixed(1)} km/h`;
      document.getElementById('speed-sub-info').innerText = 
        `Speed in MPH: ~${speedMph.toFixed(1)} mph | Estimated Motor RPM: ~${Math.round(estimatedRpm)}`;
    }

    // 3. Fetch Live RC News with Top Image Banners
    async function fetchRCNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '<div class="loader"></div>';

      const feeds = [
        { name: 'BigSquidRC', url: 'https://www.bigsquidrc.com/feed/' },
        { name: 'RedRC', url: 'https://www.redrc.net/feed/' }
      ];

      let articles = [];

      for(let feed of feeds) {
        try {
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
          const data = await res.json();
          if(data.status === 'ok') {
            data.items.slice(0, 5).forEach(item => {
              
              // Extract image from enclosure, thumbnail or content HTML
              let imgUrl = item.thumbnail || item.enclosure?.link;
              if(!imgUrl && item.content) {
                const imgMatch = item.content.match(/<img[^>]+src="([^">]+)"/);
                if(imgMatch) imgUrl = imgMatch[1];
              }

              articles.push({
                source: feed.name,
                title: item.title,
                link: item.link,
                date: new Date(item.pubDate).toLocaleDateString(),
                thumbnail: imgUrl || 'https://via.placeholder.com/600x300/121826/00f2fe?text=RC+Garage+LK'
              });
            });
          }
        } catch(e) {
          console.error("Feed error:", e);
        }
      }

      window.newsLoaded = true;

      if(articles.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-secondary); padding:20px;">Unable to fetch news right now. Please check internet connection.</p>';
        return;
      }

      container.innerHTML = articles.map(art => `
        <div class="news-card">
          <img src="${art.thumbnail}" alt="RC News Photo" onerror="this.src='https://via.placeholder.com/600x300/121826/00f2fe?text=RC+Garage+LK'">
          <div class="news-content">
            <div class="news-source">${art.source}</div>
            <div class="news-title">${art.title}</div>
            <div class="news-date">${art.date}</div>
            <a href="${art.link}" target="_blank" class="news-link">
              Read Full Article <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    // PWA Cache Clearing Logic
    function forceAppUpdate() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
          window.location.reload(true);
        });
      } else {
        window.location.reload(true);
      }
    }
  </script>
</body>
</html>
