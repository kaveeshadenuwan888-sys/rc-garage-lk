<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Garage LK - Pro Suite</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding-bottom: 85px;
      min-height: 100vh;
    }

    /* Header */
    header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 14, 20, 0.85);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pwa-reload-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .profile-avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: 2px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .profile-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Install Prompt Card Banner */
    .install-banner-overlay {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 20px;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .install-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .install-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Downloading Progress Overlay */
    .download-anim-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 20, 0.92);
      backdrop-filter: blur(12px);
      z-index: 3000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .progress-bar-container {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.2s ease-in-out;
    }

    /* Layout & Tabs */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 20px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-cyan);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 20, 31, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #121826;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .avatar-upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 16px 0 20px;
    }

    .avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--accent-cyan);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Custom Google Button UI Fallback */
    .custom-google-btn {
      width: 100%;
      background: #ffffff;
      color: #333333;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 68px;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      border: none;
      background: none;
      width: 33.3%;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    /* Chat UI */
    .chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(11, 14, 20, 0.6);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .chat-msg.bot {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.05);
      align-self: flex-start;
      color: var(--text-primary);
    }

    .chat-msg.user {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      align-self: flex-end;
      color: #fff;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input-row input { flex: 1; }
    .chat-input-row button {
      width: 50px;
      background: var(--accent-cyan);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- App Configuration -->
  <script>
    const APP_CONFIG = {
      // Direct Gemini API Key
      GEMINI_API_KEY: "YOUR_DEFAULT_GEMINI_API_KEY_HERE",
      // Add your Google Client ID here from Google Cloud Console
      GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
    };
  </script>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-gear"></i> RC GARAGE LK
    </div>
    <div class="header-actions">
      <button class="pwa-reload-btn" onclick="forceAppUpdate()">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <div class="profile-avatar-btn" onclick="openProfileModal()">
        <span id="header-avatar-container"><i class="fa-solid fa-user"></i></span>
      </div>
    </div>
  </header>

  <!-- PWA Install Prompt Banner -->
  <div class="install-banner-overlay" id="install-banner">
    <div class="install-flex">
      <div>
        <div style="font-weight:700; font-size:0.95rem; color:#fff;">Download R/C Garage SL</div>
        <div style="font-size:0.75rem; color:var(--text-secondary);">Add to Home Screen for quick access</div>
      </div>
      <button class="install-btn" onclick="triggerAppDownloadAnimation()">Download</button>
    </div>
  </div>

  <!-- Download Progress Overlay Screen -->
  <div class="download-anim-overlay" id="download-overlay">
    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--accent-cyan);"></i>
    <h3 style="margin-top:20px; font-size:1.1rem; color:#fff;" id="download-status-txt">Downloading R/C Garage SL...</h3>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="container">

    <!-- TAB 1: GARAGE TOOLS -->
    <div id="tools-tab" class="tab-content active">
      <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-battery-charging-full"></i> Battery Runtime Tester</div>
        <div class="form-group">
          <label>Capacity (mAh)</label>
          <input type="number" id="bat-mah" value="2200">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Battery Type</label>
            <select id="bat-chem">
              <option value="lipo">LiPo (3.7V)</option>
              <option value="liion">Li-Ion (3.6V)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cell Count</label>
            <select id="bat-cells">
              <option value="2">2S (7.4V)</option>
              <option value="3">3S (11.1V)</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="calculateRuntime()">Calculate Runtime</button>
      </div>
    </div>

    <!-- TAB 2: GEMINI AI MECHANIC -->
    <div id="ai-tab" class="tab-content">
      <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-robot"></i> Gemini AI RC Mechanic</div>
        <div class="chat-box" id="ai-chat-box">
          <div class="chat-msg bot">👋 ආයුබෝවන්! මම ඔයාගේ <strong>Gemini AI RC Mechanic</strong>. ඕනෑම ප්‍රශ්නයක් ඇතුළත් කරන්න.</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="ai-input" placeholder="Ask Gemini..." onkeypress="if(event.key==='Enter') sendAiMessage()">
          <button onclick="sendAiMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

  </div>

  <!-- PROFILE & SIGN IN MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeProfileModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="card-title"><i class="fa-solid fa-circle-user"></i> User Profile</div>

      <div class="avatar-upload-box">
        <div class="avatar-preview" id="modal-avatar-preview">
          <i class="fa-solid fa-user" style="font-size: 2.2rem; color: var(--text-secondary);"></i>
        </div>
        <button class="pwa-reload-btn" onclick="document.getElementById('avatar-file-input').click()">
          <i class="fa-solid fa-camera"></i> Change Photo
        </button>
        <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
      </div>

      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="user-name-input" placeholder="Enter display name" value="RC Enthusiast">
      </div>

      <button class="btn-primary" onclick="saveProfileDetails()">Save Profile</button>

      <div style="margin-top: 20px; border-top:1px solid var(--card-border); padding-top:16px;">
        <label>Quick Sign In with Google</label>
        
        <!-- Native SDK Container -->
        <div id="g-signin-container" style="margin-top: 10px; display:flex; justify-content:center;"></div>

        <!-- Direct Action Fallback Button -->
        <button class="custom-google-btn" onclick="triggerGooglePopup()">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google">
          Sign in with Google
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tools-tab', this)">
      <i class="fa-solid fa-toolbox"></i>
      <span>Tools</span>
    </button>
    <button class="nav-item" onclick="switchTab('ai-tab', this)">
      <i class="fa-solid fa-robot"></i>
      <span>AI Mechanic</span>
    </button>
  </nav>

  <script>
    let deferredPrompt;

    // Listen for PWA Install Event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Show Install Banner if not installed
      if(!localStorage.getItem('rc_app_installed')) {
        document.getElementById('install-banner').style.display = 'block';
      }
    });

    // PWA Download Animation Handler
    function triggerAppDownloadAnimation() {
      document.getElementById('install-banner').style.display = 'none';
      const overlay = document.getElementById('download-overlay');
      const progressFill = document.getElementById('progress-fill');
      const statusTxt = document.getElementById('download-status-txt');

      overlay.style.display = 'flex';
      let progress = 0;

      const interval = setInterval(() => {
        progress += 20;
        progressFill.style.width = progress + '%';

        if(progress >= 100) {
          clearInterval(interval);
          statusTxt.innerText = "Adding to Home Screen...";
          setTimeout(() => {
            overlay.style.display = 'none';
            if (deferredPrompt) {
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                  localStorage.setItem('rc_app_installed', 'true');
                }
              });
            }
          }, 800);
        }
      }, 300);
    }

    // Auto Check if opened from Home Screen (PWA Mode)
    function checkAppLaunchMode() {
      const isPwa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isLoggedIn = localStorage.getItem('rc_is_logged_in');

      // If app opened via shortcut and user is not logged in -> Auto open popup
      if (isPwa && !isLoggedIn) {
        setTimeout(() => openProfileModal(), 500);
      }
    }

    // Tab Navigation
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Profile & Modal
    function openProfileModal() {
      document.getElementById('profile-modal').style.display = 'flex';
      loadProfileData();
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const imgUrl = evt.target.result;
          localStorage.setItem('rc_user_avatar', imgUrl);
          updateAvatarUI(imgUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfileDetails() {
      const name = document.getElementById('user-name-input').value.trim();
      if(name) {
        localStorage.setItem('rc_user_name', name);
        localStorage.setItem('rc_is_logged_in', 'true');
      }
      alert('Profile saved!');
      closeProfileModal();
    }

    function loadProfileData() {
      const savedName = localStorage.getItem('rc_user_name') || 'RC Enthusiast';
      const savedAvatar = localStorage.getItem('rc_user_avatar');

      document.getElementById('user-name-input').value = savedName;
      if(savedAvatar) updateAvatarUI(savedAvatar);
    }

    function updateAvatarUI(url) {
      document.getElementById('modal-avatar-preview').innerHTML = `<img src="${url}">`;
      document.getElementById('header-avatar-container').innerHTML = `<img src="${url}">`;
    }

    // Google Sign-In SDK Render
    function setupGoogleSignIn() {
      if(window.google && APP_CONFIG.GOOGLE_CLIENT_ID && !APP_CONFIG.GOOGLE_CLIENT_ID.includes("YOUR_GOOGLE_CLIENT_ID")) {
        try {
          google.accounts.id.initialize({
            client_id: APP_CONFIG.GOOGLE_CLIENT_ID,
            callback: handleGoogleSignIn
          });
          const container = document.getElementById('g-signin-container');
          if(container) {
            container.innerHTML = '';
            google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', shape: 'pill' });
          }
        } catch(e) { console.error(e); }
      }
    }

    function triggerGooglePopup() {
      if(window.google && APP_CONFIG.GOOGLE_CLIENT_ID && !APP_CONFIG.GOOGLE_CLIENT_ID.includes("YOUR_GOOGLE_CLIENT_ID")) {
        google.accounts.id.prompt();
      } else {
        // Fallback demo sign-in
        const userName = document.getElementById('user-name-input').value || "Google User";
        localStorage.setItem('rc_user_name', userName);
        localStorage.setItem('rc_is_logged_in', 'true');
        alert(`Signed in as ${userName}!`);
        closeProfileModal();
      }
    }

    function handleGoogleSignIn(response) {
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const userData = JSON.parse(window.atob(base64));

        if(userData) {
          localStorage.setItem('rc_user_name', userData.name);
          localStorage.setItem('rc_user_avatar', userData.picture);
          localStorage.setItem('rc_is_logged_in', 'true');
          loadProfileData();
          alert(`Welcome, ${userData.name}!`);
          closeProfileModal();
        }
      } catch(e) {}
    }

    // Runtime Calculation
    function calculateRuntime() {
      const mah = parseFloat(document.getElementById('bat-mah').value);
      if(!mah || mah <= 0) return alert('Enter valid mAh');
      alert(`Estimated Runtime: ~${Math.round((mah * 0.8 / 8500) * 60)} Mins`);
    }

    // Gemini AI Chat
    async function sendAiMessage() {
      const input = document.getElementById('ai-input');
      const msg = input.value.trim();
      if(!msg) return;

      const chatBox = document.getElementById('ai-chat-box');
      chatBox.innerHTML += `<div class="chat-msg user">${msg}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingId = 'loader-' + Date.now();
      chatBox.innerHTML += `<div class="chat-msg bot" id="${loadingId}"><i class="fa-solid fa-spinner fa-spin"></i> Processing...</div>`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${APP_CONFIG.GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Answer briefly: ${msg}` }] }]
          })
        });

        const data = await response.json();
        const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to retrieve response.";
        document.getElementById(loadingId).outerHTML = `<div class="chat-msg bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
      } catch(e) {
        document.getElementById(loadingId).outerHTML = `<div class="chat-msg bot">❌ Connection error.</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function forceAppUpdate() {
      window.location.reload(true);
    }

    window.onload = function() {
      loadProfileData();
      setupGoogleSignIn();
      checkAppLaunchMode();
    };
  </script>
