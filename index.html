<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Garage LK - Pro Suite</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding-bottom: 85px;
      min-height: 100vh;
    }

    /* Header */
    header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(11, 14, 20, 0.85);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pwa-reload-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .profile-avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: 2px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .profile-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Install Banner */
    .install-banner-overlay {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 20px;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .install-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .install-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Downloading Overlay */
    .download-anim-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 20, 0.92);
      backdrop-filter: blur(12px);
      z-index: 3000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .progress-bar-container {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.2s ease-in-out;
    }

    /* Container & Tabs */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 20px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent-cyan);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 20, 31, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Live RC News Styling */
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      overflow: hidden;
      margin-bottom: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .news-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 242, 254, 0.3);
    }

    .news-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #1e293b;
    }

    .news-body {
      padding: 16px;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .news-tag {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .news-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .news-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .news-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Skeleton Loading UI */
    .skeleton-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .skeleton-img {
      width: 100%;
      height: 150px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 12px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    .skeleton-line {
      height: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      margin-bottom: 8px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #121826;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: none; border: none;
      color: var(--text-secondary);
      font-size: 1.2rem; cursor: pointer;
    }

    .avatar-upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 16px 0 20px;
    }

    .avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--accent-cyan);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
    }

    .avatar-preview img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .google-auth-btn {
      width: 100%;
      background: #ffffff;
      color: #333333;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 68px;
      background: rgba(11, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      border: none; background: none;
      width: 33.3%;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    /* Chat UI */
    .chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(11, 14, 20, 0.6);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      display: flex; flex-direction: column;
      gap: 12px; margin-bottom: 12px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .chat-msg.bot {
      background: rgba(30, 41, 59, 0.9);
      align-self: flex-start;
      color: var(--text-primary);
    }

    .chat-msg.user {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      align-self: flex-end;
      color: #fff;
    }

    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input { flex: 1; }
    .chat-input-row button {
      width: 50px;
      background: var(--accent-cyan);
      color: #000; border: none;
      border-radius: 12px; font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-gear"></i> RC GARAGE LK
    </div>
    <div class="header-actions">
      <button class="pwa-reload-btn" onclick="forceAppUpdate()">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <div class="profile-avatar-btn" onclick="openProfileModal()">
        <span id="header-avatar-container"><i class="fa-solid fa-user"></i></span>
      </div>
    </div>
  </header>

  <!-- PWA Install Banner -->
  <div class="install-banner-overlay" id="install-banner">
    <div class="install-flex">
      <div>
        <div style="font-weight:700; font-size:0.95rem; color:#fff;">Download R/C Garage SL</div>
        <div style="font-size:0.75rem; color:var(--text-secondary);">Add to Home Screen for quick access</div>
      </div>
      <button class="install-btn" onclick="triggerAppDownloadAnimation()">Download</button>
    </div>
  </div>

  <!-- Download Overlay -->
  <div class="download-anim-overlay" id="download-overlay">
    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--accent-cyan);"></i>
    <h3 style="margin-top:20px; font-size:1.1rem; color:#fff;" id="download-status-txt">Downloading R/C Garage SL...</h3>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="container">

    <!-- TAB 1: GARAGE TOOLS -->
    <div id="tools-tab" class="tab-content active">
      <div class="glass-card">
        <div class="card-title">
          <span><i class="fa-solid fa-battery-charging-full"></i> Battery Runtime Tester</span>
        </div>
        <div class="form-group">
          <label>Capacity (mAh)</label>
          <input type="number" id="bat-mah" value="2200">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Battery Type</label>
            <select id="bat-chem">
              <option value="lipo">LiPo (3.7V)</option>
              <option value="liion">Li-Ion (3.6V)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cell Count</label>
            <select id="bat-cells">
              <option value="2">2S (7.4V)</option>
              <option value="3">3S (11.1V)</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="calculateRuntime()">Calculate Runtime</button>
      </div>
    </div>

    <!-- TAB 2: LIVE RC NEWS -->
    <div id="news-tab" class="tab-content">
      <div class="card-title" style="margin-bottom:14px;">
        <span><i class="fa-solid fa-newspaper"></i> World RC News</span>
        <button class="pwa-reload-btn" onclick="fetchLiveRcNews()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
      </div>
      
      <!-- News List Container -->
      <div id="news-container">
        <!-- Skeleton Loaders -->
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-line" style="width: 80%;"></div>
          <div class="skeleton-line" style="width: 50%;"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-line" style="width: 70%;"></div>
          <div class="skeleton-line" style="width: 40%;"></div>
        </div>
      </div>
    </div>

    <!-- TAB 3: GEMINI AI MECHANIC -->
    <div id="ai-tab" class="tab-content">
      <div class="glass-card">
        <div class="card-title"><span><i class="fa-solid fa-robot"></i> Gemini AI RC Mechanic</span></div>
        <div class="chat-box" id="ai-chat-box">
          <div class="chat-msg bot">👋 ආයුබෝවන්! මම ඔයාගේ <strong>Gemini AI RC Mechanic</strong>. ඕනෑම ප්‍රශ්නයක් ඇතුළත් කරන්න.</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="ai-input" placeholder="Ask Gemini..." onkeypress="if(event.key==='Enter') sendAiMessage()">
          <button onclick="sendAiMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

  </div>

  <!-- PROFILE & SIGN IN MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeProfileModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="card-title"><span><i class="fa-solid fa-circle-user"></i> User Profile</span></div>

      <div class="avatar-upload-box">
        <div class="avatar-preview" id="modal-avatar-preview">
          <i class="fa-solid fa-user" style="font-size: 2.2rem; color: var(--text-secondary);"></i>
        </div>
        <button class="pwa-reload-btn" onclick="document.getElementById('avatar-file-input').click()">
          <i class="fa-solid fa-camera"></i> Change Photo
        </button>
        <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
      </div>

      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="user-name-input" placeholder="Enter display name" value="RC Enthusiast">
      </div>

      <button class="btn-primary" onclick="saveProfileDetails()">Save Profile</button>

      <div style="margin-top: 20px; border-top:1px solid var(--card-border); padding-top:16px;">
        <label>Quick Sign In with Google</label>
        <button class="google-auth-btn" id="firebase-google-btn">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google">
          Sign in with Google
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tools-tab', this)">
      <i class="fa-solid fa-toolbox"></i>
      <span>Tools</span>
    </button>
    <button class="nav-item" onclick="switchTab('news-tab', this)">
      <i class="fa-solid fa-newspaper"></i>
      <span>RC News</span>
    </button>
    <button class="nav-item" onclick="switchTab('ai-tab', this)">
      <i class="fa-solid fa-robot"></i>
      <span>AI Mechanic</span>
    </button>
  </nav>

  <!-- FIREBASE SDK v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDc3kDN1KPnXK98NI2NvwZyxCvDZxLa13w",
      authDomain: "rc-garage-lk-4092e.firebaseapp.com",
      databaseURL: "https://rc-garage-lk-4092e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rc-garage-lk-4092e",
      storageBucket: "rc-garage-lk-4092e.firebasestorage.app",
      messagingSenderId: "109607090814",
      appId: "1:109607090814:web:f581ad97ddc9ae7c4d762f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('firebase-google-btn').addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        
        localStorage.setItem('rc_user_name', user.displayName || 'RC Enthusiast');
        if (user.photoURL) {
          localStorage.setItem('rc_user_avatar', user.photoURL);
        }
        localStorage.setItem('rc_is_logged_in', 'true');

        window.loadProfileData();
        alert(`Successfully signed in as ${user.displayName}!`);
        window.closeProfileModal();

      } catch (error) {
        console.error("Firebase Sign-In Error:", error);
        alert("Google Sign-In Failed: " + error.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.setItem('rc_user_name', user.displayName || 'RC Enthusiast');
        if (user.photoURL && !localStorage.getItem('rc_user_avatar')) {
          localStorage.setItem('rc_user_avatar', user.photoURL);
        }
        localStorage.setItem('rc_is_logged_in', 'true');
        window.loadProfileData();
      }
    });
  </script>

  <!-- MAIN SCRIPT -->
  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if(!localStorage.getItem('rc_app_installed')) {
        document.getElementById('install-banner').style.display = 'block';
      }
    });

    function triggerAppDownloadAnimation() {
      document.getElementById('install-banner').style.display = 'none';
      const overlay = document.getElementById('download-overlay');
      const progressFill = document.getElementById('progress-fill');
      const statusTxt = document.getElementById('download-status-txt');

      overlay.style.display = 'flex';
      let progress = 0;

      const interval = setInterval(() => {
        progress += 20;
        progressFill.style.width = progress + '%';

        if(progress >= 100) {
          clearInterval(interval);
          statusTxt.innerText = "Adding to Home Screen...";
          setTimeout(() => {
            overlay.style.display = 'none';
            if (deferredPrompt) {
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                  localStorage.setItem('rc_app_installed', 'true');
                }
              });
            }
          }, 800);
        }
      }, 300);
    }

    function checkAppLaunchMode() {
      const isPwa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      const isLoggedIn = localStorage.getItem('rc_is_logged_in');

      if (isPwa && !isLoggedIn) {
        setTimeout(() => openProfileModal(), 500);
      }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if(tabId === 'news-tab') {
        fetchLiveRcNews();
      }
    }

    // REAL-TIME RC NEWS FETCHING (Option 2)
    async function fetchLiveRcNews() {
      const container = document.getElementById('news-container');
      
      // Fallback default image in case feed image is missing
      const defaultImg = "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=600&q=80";
      
      // RCDriver RSS Feed via RSS2JSON API
      const rssUrl = "https://www.rcdriver.com/feed/";
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items.length > 0) {
          container.innerHTML = '';
          
          data.items.slice(0, 10).forEach(item => {
            // Extract image URL from description or thumbnail
            let imgUrl = item.thumbnail || defaultImg;
            if (imgUrl === defaultImg && item.description) {
              const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
              if (imgMatch) imgUrl = imgMatch[1];
            }

            // Clean description text
            const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').substring(0, 120) + '...';
            const pubDate = new Date(item.pubDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            container.innerHTML += `
              <a href="${item.link}" target="_blank" class="news-card">
                <img src="${imgUrl}" class="news-img" alt="RC News" onerror="this.src='${defaultImg}'">
                <div class="news-body">
                  <div class="news-meta">
                    <span class="news-tag">GLOBAL RC</span>
                    <span class="news-date"><i class="fa-regular fa-clock"></i> ${pubDate}</span>
                  </div>
                  <div class="news-title">${item.title}</div>
                  <div class="news-desc">${cleanDesc}</div>
                </div>
              </a>
            `;
          });
        } else {
          throw new Error('Invalid feed data');
        }

      } catch (error) {
        console.error("Failed to load RC news:", error);
        container.innerHTML = `
          <div class="glass-card" style="text-align:center; padding:30px;">
            <i class="fa-solid fa-wifi" style="font-size:2rem; color:var(--text-muted); margin-bottom:10px;"></i>
            <div style="font-size:0.9rem; color:var(--text-secondary);">Unable to load latest news right now.</div>
            <button class="pwa-reload-btn" style="margin-top:12px;" onclick="fetchLiveRcNews()">Try Again</button>
          </div>
        `;
      }
    }

    // PROFILE MANAGEMENT
    window.openProfileModal = function() {
      document.getElementById('profile-modal').style.display = 'flex';
      loadProfileData();
    };

    window.closeProfileModal = function() {
      document.getElementById('profile-modal').style.display = 'none';
    };

    window.handleImageUpload = function(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const imgUrl = evt.target.result;
          localStorage.setItem('rc_user_avatar', imgUrl);
          updateAvatarUI(imgUrl);
        };
        reader.readAsDataURL(file);
      }
    };

    window.saveProfileDetails = function() {
      const name = document.getElementById('user-name-input').value.trim();
      if(name) {
        localStorage.setItem('rc_user_name', name);
        localStorage.setItem('rc_is_logged_in', 'true');
      }
      alert('Profile saved!');
      closeProfileModal();
    };

    window.loadProfileData = function() {
      const savedName = localStorage.getItem('rc_user_name') || 'RC Enthusiast';
      const savedAvatar = localStorage.getItem('rc_user_avatar');

      document.getElementById('user-name-input').value = savedName;
      if(savedAvatar) {
        updateAvatarUI(savedAvatar);
      }
    };

    function updateAvatarUI(url) {
      document.getElementById('modal-avatar-preview').innerHTML = `<img src="${url}">`;
      document.getElementById('header-avatar-container').innerHTML = `<img src="${url}">`;
    }

    function calculateRuntime() {
      const mah = parseFloat(document.getElementById('bat-mah').value);
      if(!mah || mah <= 0) return alert('Enter valid mAh');
      alert(`Estimated Runtime: ~${Math.round((mah * 0.8 / 8500) * 60)} Mins`);
    }

    async function sendAiMessage() {
      const input = document.getElementById('ai-input');
      const msg = input.value.trim();
      if(!msg) return;

      const chatBox = document.getElementById('ai-chat-box');
      chatBox.innerHTML += `<div class="chat-msg user">${msg}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingId = 'loader-' + Date.now();
      chatBox.innerHTML += `<div class="chat-msg bot" id="${loadingId}"><i class="fa-solid fa-spinner fa-spin"></i> Processing...</div>`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${APP_CONFIG.GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Answer briefly: ${msg}` }] }]
          })
        });

        const data = await response.json();
        const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to retrieve response.";
        document.getElementById(loadingId).outerHTML = `<div class="chat-msg bot">${aiReply.replace(/\n/g, '<br>')}</div>`;
      } catch(e) {
        document.getElementById(loadingId).outerHTML = `<div class="chat-msg bot">❌ Connection error.</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function forceAppUpdate() {
      window.location.reload(true);
    }

    window.onload = function() {
      loadProfileData();
      checkAppLaunchMode();
    };
  </script>
